<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Roguejack - Otter Knight</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="draw-anim-container"></div>

<div class="table-header">
    <div class="top-card">
        <img src="designs/otter_idle.png" alt="Otter Knight">
        <div class="label">Otter Knight</div>
    </div>

    <div class="dealer-area">
        <div class="dealer-box" id="dealer-box">
            <img id="dealerSprite" src="designs/hand.png" alt="The Hand">
        </div>
        <div class="dealer-label">The Hand</div>
        <div class="floor-indicator" id="floor-level">Floor: 1</div>
        <div class="gold-indicator" id="gold-indicator">Gold: 50</div>
        <div class="energy-indicator" id="energy-indicator">Energy: <span class="energy-value">0</span></div>
        <div class="dealer-deck" id="dealer-deck">
            <div class="deck-stack"></div>
        </div>
    </div>

    <div class="top-card" id="enemyIcon">
        <img id="enemyIconImg" src="" alt="Enemy Icon">
        <div class="label" id="enemyIconName">Enemy</div>
    </div>
</div>

<div class="table-row">
    <div class="panel" style="flex:1;">
        <div class="panel-title">PLAYER</div>

        <div class="sprite-box">
            <img id="playerSprite" src="designs/otter_idle.png" alt="Otter Sprite">
        </div>

        <div id="player-hand-container" class="hand-row"></div>
        <div id="player-total-value" class="hand-total">0</div>

        <div class="hp-wrapper">
            <div class="hp-bar">
                <div class="hp-fill" id="playerHPFill"></div>
            </div>
            <div class="hp-text" id="player-hp-text">100/100</div>
        </div>

        <div class="log-container" id="playerLog"></div>

        <div class="action-bar">
            <button id="hit-button">Hit</button>
            <button id="stand-button">Stand</button>
            <button id="double-button" style="display: none;">DOUBLE</button>
            <button id="peek-button">PEEK (1)</button>
            <button id="aegis-button">AEGIS (2)</button>
            <button id="forge-button">FORGE (1)</button>
            <button id="restart-button">Restart</button>
        </div>
        <div id="peek-indicator" class="peek-indicator" style="display: none;"></div>
    </div>

    <div class="panel enemy-panel" id="enemyPanel" style="flex:1;">
        <div class="panel-title">ENEMY</div>

        <div class="sprite-box">
            <img id="enemySprite" src="" alt="Enemy Sprite">
        </div>

        <div id="enemy-hand-container" class="hand-row"></div>

        <div class="hp-wrapper">
            <div class="hp-bar">
                <div class="hp-fill" id="enemyHPFill"></div>
            </div>
            <div class="hp-text" id="enemy-hp-text">100/100</div>
        </div>

        <div class="log-container" id="enemyLog"></div>
    </div>
</div>

<div id="shop-screen" style="display: none;">
    <div id="shop-panel">
        <h2 id="shop-title">The Wanderer's Emporium (Floor 1)</h2>
        
        <div id="item-container">
            
            <div class="shop-item-card">
                <div class="item-title-bar">Minor Health Potion</div>
                <div class="item-icon">💉</div> 
                <p class="item-desc">Restores 30 HP.</p>
                <div class="item-cost">50 Gold</div>
                <button class="buy-button" id="buy-potion">BUY</button>
            </div>

            <div class="shop-item-card">
                <div class="item-title-bar">Shuffled Deck</div>
                <div class="item-icon">🃏</div>
                <p class="item-desc">Gain +2 Energy.</p>
                <div class="item-cost">25 Gold</div>
                <button class="buy-button" id="buy-deck">BUY</button>
            </div>

            <div class="shop-item-card">
                <div class="item-title-bar">Otter's Charm</div>
                <div class="item-icon">⚜️</div>
                <p class="item-desc">Permanent Max HP +15.</p>
                <div class="item-cost">75 Gold</div>
                <button class="buy-button" id="buy-charm">BUY</button>
            </div>

        </div> 
        
        <button id="continue-button" class="buy-button">CONTINUE</button>
    </div>
</div>

<script src="game.js"></script>
<script src="ui.js"></script>
</body>
</html>
